version: "3.8"

networks:
  default-network:

services:
  php:
    build: .
    volumes:
      - ..:/workspace:cached
      # (Opcional) cache do composer no host para acelerar installs:
      # - composer_cache:/root/.composer
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      # (Opcional) se tiver erro de autenticação com PHP 7.4, force plugin clássico:
      # MYSQL_ROOT_HOST: "%"
      # MYSQL_USER: user
      # MYSQL_PASSWORD: password
      # MYSQL_DATABASE: app
      # DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password  # Não é var oficial
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default-network

volumes:
  db_data:
  # composer_cache:
